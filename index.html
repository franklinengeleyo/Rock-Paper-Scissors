<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<link rel="stylesheet" href="style.css">

<body>

    <h1>ROCK PAPER SCISSORS GAME</h1>

    <p>Round: <span id="round">0</span> / 5</p>
    <p>Player Choice: <span id="playerChoiceDisplay">-</span></p>
    <p>Computer Choice: <span id="computerChoiceDisplay">-</span></p>
    <p>Round Result: <span id="roundResultDisplay">Waiting for player...</span></p>
    <p>Player Score: <span id="playerScoreDisplay">0</span></p>
    <p>Computer Score: <span id="computerScoreDisplay">0</span></p>
    <p>Winner: <span id="winnerDisplay">-</span></p>

    <!-- BUTTONS -->
   <button class="rockBtn">🪨 Rock</button>
   <button class="paperBtn">📄 Paper</button>
   <button class="scissorsBtn">✂️ Scissors</button>

    <br><br>

    <button class="restartButton">Restart Game</button>


    <script src="index.js"></script>
</body>
</html>
